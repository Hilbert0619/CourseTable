name: CourseKit

# Pure-Swift logic tests on Linux, including the shared test cases in spec/fixtures/ (the Android port reads them too).
on:
  push:
    branches: [main]
    paths:
      - "CourseKit/**"
      - "spec/**"
      - ".github/workflows/coursekit.yml"
  pull_request:
    paths:
      - "CourseKit/**"
      - "spec/**"
      - ".github/workflows/coursekit.yml"
  workflow_dispatch:

concurrency:
  group: coursekit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: swift test (Linux, Swift 6.4)
    runs-on: ubuntu-latest
    container: swift:6.4
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CourseKit
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: swift build --build-tests
      - run: swift test --skip-build
