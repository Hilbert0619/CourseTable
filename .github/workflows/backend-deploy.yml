name: Backend deploy

# Applies the migrations in supabase/migrations to the cloud project and sets its sign-in options
# (supabase/remote-auth.json), then checks the result. Run by hand: gh workflow run backend-deploy.yml
#
# Needs, in the repository settings (Secrets and variables → Actions):
#   secret   SUPABASE_ACCESS_TOKEN  a Supabase personal access token (Account → Access Tokens)
#   secret   SUPABASE_DB_PASSWORD   the project's database password
#   variable SUPABASE_PROJECT_REF   the project ref, e.g. abcdefghijklmnopqrst from https://abcdefghijklmnopqrst.supabase.co
on:
  workflow_dispatch:
    inputs:
      auth_settings:
        description: Also apply the sign-in settings from supabase/remote-auth.json
        type: boolean
        default: true
      code_emails:
        description: Send the 6-digit-code email templates (needs a custom SMTP sender on the project)
        type: boolean
        default: false

concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Supabase Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7

      # Says what kind of value a secret holds (never the value itself) and drops stray spaces or line breaks.
      - name: Check the settings
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          [ $missing = 0 ] || exit 1
          token=$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]')
          echo "::add-mask::$token"
          case "$token" in
            sbp_*) echo "SUPABASE_ACCESS_TOKEN is a personal access token (sbp_…), ${#token} characters" ;;
            sb_secret_*) echo "::error::SUPABASE_ACCESS_TOKEN holds the project's secret API key (sb_secret_…). It needs a personal access token (sbp_…) from Account → Access Tokens."; exit 1 ;;
            sb_publishable_*) echo "::error::SUPABASE_ACCESS_TOKEN holds the publishable key (sb_publishable_…). It needs a personal access token (sbp_…) from Account → Access Tokens."; exit 1 ;;
            eyJ*) echo "::error::SUPABASE_ACCESS_TOKEN holds a JWT (a legacy anon or service_role key). It needs a personal access token (sbp_…) from Account → Access Tokens."; exit 1 ;;
            *) echo "::error::SUPABASE_ACCESS_TOKEN doesn't start with sbp_ (${#token} characters). It needs a personal access token from Account → Access Tokens."; exit 1 ;;
          esac
          if [ "$token" != "$SUPABASE_ACCESS_TOKEN" ]; then echo "Removed spaces or line breaks around the token"; fi
          case "$SUPABASE_DB_PASSWORD" in
            sbp_*) echo "::error::SUPABASE_DB_PASSWORD holds an access token (sbp_…): the two secrets look swapped."; exit 1 ;;
            *) echo "SUPABASE_DB_PASSWORD is set, ${#SUPABASE_DB_PASSWORD} characters" ;;
          esac
          echo "SUPABASE_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Link the project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Migrations to apply
        run: supabase db push --dry-run

      - name: Apply migrations
        run: supabase db push

      # Prints the API's error message on failure and, on success, the stored value of each field sent.
      # Free projects using Supabase's built-in email can't change email templates, so the code emails
      # (remote-auth-code-emails.json) are only sent on request, once the project has its own SMTP sender.
      - name: Sign-in settings
        if: inputs.auth_settings
        run: |
          set -o pipefail
          apply() { # description, settings file
            local body code
            body=$(jq -c . "$2")
            code=$(curl -sS -o response.json -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data "$body")
            if [ "$code" != 200 ]; then
              echo "::error::$1 refused: HTTP $code"
              cat response.json; echo
              return 1
            fi
            echo "$1 applied:"
            jq --argjson sent "$body" 'with_entries(select(.key as $k | $sent | has($k)) | .value |= (tostring | .[0:70]))' response.json
          }
          apply "Sign-in options" supabase/remote-auth.json
          if [ "${{ inputs.code_emails }}" = true ]; then
            apply "Email templates with the 6-digit code" supabase/remote-auth-code-emails.json
          fi

      - name: Check the database
        run: |
          result=$(curl -sS --fail-with-body -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data "$(jq -Rs '{query: .}' < supabase/checks/deployed.sql)")
          echo "$result" | jq .
          echo "$result" | jq -e '.[0] | .words == 4801 and .kaoyan_entries == 4801 and .rls_on == true
                                        and .anon_can_read_words == false and .answers_editable == false' > /dev/null
