name: Backend

# The vocabulary backend on a local Supabase stack: migrations, pgTAP tests (schema, content, row-level
# security) and an end-to-end API check. Linux runner: 1× billing on the free private-repo minutes.
on:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Supabase (local stack, Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      # Only what the app talks to: Postgres, Auth (gotrue), the REST API (postgrest), Storage and the gateway (kong).
      - name: Start Supabase
        run: supabase start -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      # The Focus wallpapers' pictures (config.toml [storage.buckets.wallpapers]), as backend-deploy.yml uploads them.
      - name: Upload the wallpapers
        run: supabase seed buckets

      - name: Database tests (pgTAP)
        run: supabase test db

      - name: API check
        run: bash supabase/tests/api/smoke.sh

      - name: Lint database functions
        run: supabase db lint --level warning --fail-on warning

      # backend-deploy.yml runs this query on the cloud project and sends remote-auth.json to it.
      - name: Deploy check and settings file
        run: |
          result=$(docker exec -i supabase_db_CourseTable psql -U postgres -At -F '|' < supabase/checks/deployed.sql)
          echo "$result"
          test "$result" = "4801|4801|t|f|f|30|t"
          jq -e '.site_url as $app | .mailer_autoconfirm == false and (.uri_allow_list | contains($app))' supabase/remote-auth.json > /dev/null
          jq -e '.mailer_templates_confirmation_content | contains("{{ .Token }}")' supabase/remote-auth-code-emails.json > /dev/null

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
